# Cabeçalhos de toda resposta do DMTabata web. Incluído em cada `location` porque um
# add_header dentro de location cancela a herança dos de nível server.

# SQLite no navegador (expo-sqlite) usa SharedArrayBuffer, que só existe com isolamento
# de origem. Tudo é servido pela própria origem, então require-corp não bloqueia nada.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Microfone liberado só para o próprio app (gravar sons de até 3 s).
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
# 'wasm-unsafe-eval': compilar o SQLite (WebAssembly). blob:/data: para sons do usuário.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' blob: data:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/wasm image/svg+xml font/ttf;

    # Arquivos do app sempre revalidados: a versão nova aparece no próximo carregamento.
    location = /index.html {
        include /etc/nginx/snippets/dmtabata-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        include /etc/nginx/snippets/dmtabata-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/dmtabata-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Bundles e assets têm hash no nome: cache longo é seguro.
    location ^~ /_expo/ {
        include /etc/nginx/snippets/dmtabata-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        include /etc/nginx/snippets/dmtabata-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # SPA: rotas do Expo Router caem no index.html.
    location / {
        include /etc/nginx/snippets/dmtabata-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
